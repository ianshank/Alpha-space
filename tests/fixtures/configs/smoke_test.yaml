# Test fixture config — mirrors configs/smoke_test.yaml but with tmp paths.
network:
  voxel_resolution: 16
  voxel_channels: 4
  hidden_dim: 64
  num_res_blocks: 1
  action_dim: 6

mcts:
  num_simulations: 4
  max_children: 4

training:
  num_episodes: 1
  batch_size: 4
  replay_buffer_size: 50
  epochs_per_update: 1

environment:
  simulator: mock
  max_episode_steps: 10
  workspace_size: 10.0

seed: 42
use_gpu: false
no_logging: true
