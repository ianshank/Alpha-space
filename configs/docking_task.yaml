# Full docking task configuration for production training.

network:
  voxel_resolution: 64
  voxel_channels: 4
  proprioception_dim: 13
  hidden_dim: 256
  num_res_blocks: 6
  action_dim: 6
  min_log_std: -5.0
  max_log_std: 2.0

mcts:
  num_simulations: 800
  c_puct: 1.0
  max_children: 32
  temperature: 1.0
  dirichlet_alpha: 0.25
  dirichlet_epsilon: 0.25
  discount: 0.99

training:
  num_episodes: 1000
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  checkpoint_interval: 100
  eval_interval: 50
  replay_buffer_size: 10000
  value_loss_weight: 1.0
  entropy_weight: 0.01
  epochs_per_update: 4

environment:
  simulator: mock
  parallel_envs: 1
  max_episode_steps: 500
  workspace_size: 10.0
  time_step: 0.05
  max_thrust: 10.0
  max_torque: 2.0
  position_tolerance: 0.1
  orientation_tolerance_deg: 5.0
  spacecraft_mass: 100.0
  spacecraft_inertia: [10.0, 10.0, 10.0]

reward:
  position_weight: 1.0
  orientation_weight: 0.5
  velocity_weight: 0.1
  fuel_weight: 0.01
  success_bonus: 100.0
  collision_penalty: -50.0
  time_penalty: -0.1

checkpoint_dir: checkpoints
log_dir: logs
wandb_project: zerog-rl
seed: 42
use_gpu: true
debug: false
no_logging: false
